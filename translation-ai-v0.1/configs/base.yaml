# First real training run (small baseline, RTX 5070 12GB friendly).
seed: 7
splits: data/splits
tokenizer: data/tokenizer/tokenizer.json
run_dir: checkpoints/run-v1

vocab_size: 16000
d_model: 384
n_heads: 6
d_ff: 1536
n_enc_layers: 4
n_dec_layers: 4
dropout: 0.1
max_len: 128

batch_size: 64
accum_steps: 2
lr: 0.0005
weight_decay: 0.01
label_smoothing: 0.1
warmup_steps: 2000
max_epochs: 15
patience: 3
min_delta: 0.0001
clip: 1.0
amp: true
num_workers: 2
log_every: 100
train_scale: 1.0
