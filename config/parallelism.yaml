# ============================================================================
# parallelism.yaml — Unified Parallelism Configuration
# ============================================================================
#
# Worker Resolution Precedence (highest → lowest):
#   1. CLI/Code:    resolve_worker_count(stage, cfg, explicit=N)
#   2. Environment: ATLAS_WORKERS_<STAGE_UPPER> = N
#   3. Hardware:    ATLAS_PROFILE or hostname match (see hardware_profiles/)
#   4. YAML:        This file (config/parallelism.yaml)
#   5. Default:     Resource detection (cpu_cores, available_ram)
#
# All pipelines MUST use resolve_worker_count() from parallel.config.
# Do NOT read this file directly — use the API instead.
#
# ============================================================================

parallelism:
  classification:
    stage1_shard_workers: 8
    stage2_shard_workers: 10
    parallel_sources: 2
    skip_v11_sources: true
    print_interval: 1
    scheduler: adaptive
    target_task_size_mb: 64
    max_task_size_mb: 128
    split_large_shards: true
    min_split_size_mb: 128
    task_timeout_seconds: 3600
    max_retries: 2

  validation:
    file_workers: 8
    chunk_size: 1000
    per_file_timeout_seconds: 600

  acquisition:
    file_workers: 4
    chunk_size: 500

  extraction:
    shard_workers: 8
    shards_per_source: 41

  training_views:
    workers: 8

  release:
    # D3 (compression Phase 6B): fixed worker limit — never 'auto' yet.
    # Bounds disk write pressure on large raw input (22 GB) while keeping
    # the explicit --workers CLI override available.
    compress_workers: 4
    upload_workers: 4
