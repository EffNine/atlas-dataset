parallelism:
  classification:
    stage1_shard_workers: 8
    stage2_shard_workers: 10
    parallel_sources: 2
    skip_v11_sources: true
    print_interval: 1
    scheduler: adaptive
    target_task_size_mb: 512
    max_task_size_mb: 1024
    split_large_shards: true
    min_split_size_mb: 2048
    task_timeout_seconds: 3600
    max_retries: 2

  validation:
    file_workers: 8
    chunk_size: 1000
    per_file_timeout_seconds: 600

  acquisition:
    file_workers: 4
    chunk_size: 500

  extraction:
    shard_workers: 8
    shards_per_source: 41

  training_views:
    workers: 8
