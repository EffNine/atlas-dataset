[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "effnine-benchmark"
version = "0.1.0"
description = "EffNine Benchmark (EB) — Capability benchmark for atan-v1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
eb = "eb.cli:main"

[tool.setuptools.packages.find]
include = ["eb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
