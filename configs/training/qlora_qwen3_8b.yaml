# Atlas v0.1 -> Qwen3-8B QLoRA training config (REFERENCE / NOT ACTIVE)
#
# Per the project mandate, MODEL TRAINING IS PAUSED. This file exists so the
# path from curated/ -> training is explicit and reproducible once data is
# approved. It is a template, not an executed run.
#
# Key principle: the dataset is model-agnostic. Swap `model_name_or_path` and
# the chat template reference to target Llama/DeepSeek/Mistral instead. The
# curated JSONL is the same; only the adapter + template differ.

project: atlas-dataset
dataset_version: v0.1
base_model: Qwen/Qwen3-8B

method:
  type: qlora
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  # Produced by: python scripts/convert_format.py --format qwen_chatml \
  #              --input curated/v0.1/atlas_v0.1.jsonl --output <this file>
  train_file: data/processed/atlas_v0.1_qwen_chatml.jsonl
  validation_split: 0.05
  max_seq_length: 4096
  chat_template: configs/formatting/templates.json#qwen_chatml

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: epoch

evaluation:
  # Held-out sets live in evaluation/test_sets/. Run before/after training.
  benchmarks: evaluation/benchmarks/
  do_eval: true

output_dir: outputs/qwen3-8b-atlas-v0.1

notes: >
  Pause training until Atlas v0.1 reaches 1000 verified, high-quality examples
  and passes scripts/validate_dataset.py with zero schema violations.
